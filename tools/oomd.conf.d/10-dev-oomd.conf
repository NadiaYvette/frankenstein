# Dev-workstation systemd-oomd tuning.
# Install to: /etc/systemd/oomd.conf.d/10-dev-oomd.conf
#
# Pairs with the per-build cgroup caps in ~/.config/systemd/user/builds.slice
# (which sets ManagedOOMSwap=kill, ManagedOOMMemoryPressure=kill).  oomd acts on
# PRESSURE — earlier than the kernel's hard MemoryMax OOM — and kills the worst
# offender, so the box doesn't grind itself into swap.
#
# Reload after install:        sudo systemctl restart systemd-oomd
# Inspect what oomd watches:   oomctl
# See the effective merged cfg: systemd-analyze cat-config systemd/oomd.conf

[OOM]
# Kill the worst swap-consuming managed cgroup once total swap in use passes
# this.  A little sooner than the 90% default, but not so eager it fires during
# normal (cheap) zram swapping.  Backstop to the PSI check below.
SwapUsedLimit=85%

# For cgroups that opt into ManagedOOMMemoryPressure=kill (e.g. builds.slice):
# if memory-stall PSI stays above this for the duration, kill the worst child.
# 60% / 20s = sustained genuine thrash, not transient heavy use.
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=20s
