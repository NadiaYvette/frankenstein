# Dev-workstation VM tuning.   Install to: /etc/sysctl.d/99-dev-swappiness.conf
#
# Prefer keeping active (anonymous) working-set pages resident in RAM rather
# than swapping them out to the slow disk swap files during heavy builds;
# reclaim page cache first.  The fast zram device (compressed-RAM swap, high
# priority) still absorbs genuine spikes, and builds.slice's cgroup MemoryMax
# caps total build memory — together these keep big builds from dragging the
# desktop into disk-swap thrash.
#
# Default is 60.  10 biases strongly toward RAM.  If the page cache gets dropped
# too aggressively during IO-heavy builds, raise back toward 30-60.
vm.swappiness = 10
